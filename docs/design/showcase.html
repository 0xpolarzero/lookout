<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lookout redesign — showcase</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* ---------- Page chrome (the showcase itself, neutral) ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#18181b;color:#e4e4e7;font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
.top{position:sticky;top:0;z-index:50;background:rgba(24,24,27,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid #27272a;padding:10px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.top b{font-weight:600;margin-right:6px}
.seg{display:flex;background:#27272a;border-radius:8px;padding:2px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:4px 10px;border-radius:6px;color:#a1a1aa;font-size:12px;white-space:nowrap}
.seg button.on{background:#3f3f46;color:#fff}
.seg button:hover:not(.on){color:#e4e4e7}
.lbl{font-size:11px;color:#71717a;text-transform:uppercase;letter-spacing:.06em}
main{padding:24px 20px 80px;max-width:1260px;margin:0 auto}
.intro{margin-bottom:22px}
.intro h1{font-size:26px;font-weight:600;letter-spacing:-.02em}
.intro p{color:#a1a1aa;max-width:760px;margin-top:6px;font-size:14px}
.refs{font-size:12px;color:#a1a1aa;margin-top:8px}
.refs a{color:#93c5fd;text-decoration:none}
section.scene{margin:34px 0 0}
.scene>header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:10px}
.scene>header h2{font-size:15px;font-weight:600}
.scene>header span{color:#71717a;font-size:12.5px}
.fit{width:100%;overflow:hidden;border-radius:14px;border:1px solid #27272a}
.fit>.desk{transform-origin:0 0}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:18px}
.cmp h3{font-size:13px;font-weight:600;margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
.cmp h3 small{color:#71717a;font-weight:400}

/* ---------- Theme tokens ---------- */
.desk{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
  --head:var(--font);
  --fs:13px;
}
/* Current (baseline, as shipped) */
.t-current{--wall:linear-gradient(135deg,#6b5b95 0%,#8e6f9a 45%,#b18a8a 100%);
  --win:#141416;--win-b:rgba(255,255,255,.09);--win-r:14px;--win-sh:0 24px 60px rgba(0,0,0,.45);--blur:none;
  --tx:rgba(255,255,255,.93);--tx2:rgba(255,255,255,.64);--tx3:rgba(255,255,255,.46);
  --hair:rgba(255,255,255,.085);--hov:rgba(255,255,255,.07);--sel:rgba(255,255,255,.09);--raise:rgba(255,255,255,.045);
  --acc:#6694ff;--amb:#fdbd45;--red:#f76161;--grn:#52d180;--pur:#ad8cff;--clay:#d97857;
  --chip:rgba(255,255,255,.07);--chip-b:transparent;--chip-r:999px;
  --card:transparent;--card-b:transparent;--card-r:10px;--row-r:10px;
  --in:rgba(255,255,255,.06);--in-b:rgba(255,255,255,.09);--in-r:10px;
  --bar:#141416;--bar-r:16px;--tile-r:9px;
  --btn:rgba(255,255,255,.08);--btn-tx:var(--tx);--pri:#6694ff;--pri-tx:#fff;
  --tl:1}
/* A. Liquid Glass */
.t-glass{--wall:radial-gradient(1200px 700px at 15% 10%,#3a7bd5 0%,transparent 60%),radial-gradient(900px 600px at 90% 90%,#c04fbf 0%,transparent 55%),radial-gradient(800px 500px at 80% 10%,#f0a35e 0%,transparent 55%),#2b2f6b;
  --win:rgba(28,28,34,.42);--win-b:rgba(255,255,255,.22);--win-r:24px;--win-sh:0 30px 80px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.28),inset 0 0 0 .5px rgba(255,255,255,.08);--blur:blur(40px) saturate(190%);
  --tx:#fff;--tx2:rgba(255,255,255,.72);--tx3:rgba(255,255,255,.5);
  --hair:rgba(255,255,255,.13);--hov:rgba(255,255,255,.1);--sel:rgba(255,255,255,.16);--raise:rgba(255,255,255,.08);
  --acc:#0a84ff;--amb:#ffd60a;--red:#ff453a;--grn:#30d158;--pur:#bf5af2;--clay:#ff9f0a;
  --chip:rgba(255,255,255,.14);--chip-b:rgba(255,255,255,.18);--chip-r:999px;
  --card:rgba(255,255,255,.07);--card-b:rgba(255,255,255,.12);--card-r:18px;--row-r:12px;
  --in:rgba(255,255,255,.12);--in-b:rgba(255,255,255,.2);--in-r:999px;
  --bar:rgba(28,28,34,.4);--bar-r:22px;--tile-r:12px;
  --btn:rgba(255,255,255,.16);--btn-tx:#fff;--pri:#0a84ff;--pri-tx:#fff}
.t-glass.light{--tip-tx:#fff;--win:rgba(250,250,252,.55);--win-b:rgba(255,255,255,.7);--win-sh:0 30px 80px rgba(20,20,60,.25),inset 0 1px 0 rgba(255,255,255,.9);
  --tx:#111;--tx2:rgba(0,0,0,.62);--tx3:rgba(0,0,0,.42);--hair:rgba(0,0,0,.08);--hov:rgba(0,0,0,.05);--sel:rgba(255,255,255,.7);--raise:rgba(255,255,255,.5);
  --chip:rgba(255,255,255,.6);--chip-b:rgba(0,0,0,.06);--card:rgba(255,255,255,.5);--card-b:rgba(255,255,255,.8);--in:rgba(255,255,255,.65);--in-b:rgba(0,0,0,.06);
  --bar:rgba(250,250,252,.55);--btn:rgba(255,255,255,.7);--btn-tx:#111;--amb:#d99a00;--grn:#20a845}
/* B. Precision (Raycast / Linear) */
.t-precise{--wall:radial-gradient(900px 500px at 70% 0%,#1b1d2b 0%,transparent 70%),#050506;
  --win:#0c0d10;--win-b:#1f2127;--win-r:12px;--win-sh:0 0 0 1px #000,0 30px 70px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.04);--blur:none;
  --tx:#ededef;--tx2:#9a9ba3;--tx3:#5f6068;--hair:#1c1d22;--hov:#15161b;--sel:#1a1b22;--raise:#111216;
  --acc:#7c83ff;--amb:#f5b84a;--red:#ef5a5a;--grn:#4cc38a;--pur:#9d8cff;--clay:#e0805c;
  --chip:#15161b;--chip-b:#23252c;--chip-r:6px;--card:transparent;--card-b:transparent;--card-r:0;--row-r:6px;
  --in:#101115;--in-b:#23252c;--in-r:8px;--bar:#0c0d10;--bar-r:12px;--tile-r:7px;
  --btn:#17181d;--btn-tx:#ededef;--pri:#ededef;--pri-tx:#0c0d10;--fs:12.5px}
.t-precise.light{--tip-tx:#fff;--wall:radial-gradient(900px 500px at 70% 0%,#e6e8f5 0%,transparent 70%),#f4f4f6;
  --win:#fff;--win-b:#e4e4e8;--win-sh:0 0 0 .5px rgba(0,0,0,.06),0 24px 60px rgba(0,0,0,.12);
  --tx:#17171a;--tx2:#5f6068;--tx3:#9a9ba3;--hair:#eeeef1;--hov:#f5f5f7;--sel:#f0f0f4;--raise:#fafafb;
  --chip:#f5f5f7;--chip-b:#e4e4e8;--in:#fafafb;--in-b:#e4e4e8;--bar:#fff;--btn:#f3f3f5;--btn-tx:#17171a;--pri:#17171a;--pri-tx:#fff;--amb:#d48a06;--acc:#5e6ad2}
/* C. Island */
.t-island{--wall:linear-gradient(160deg,#d8dbe8 0%,#c9cfe0 40%,#e6d9d2 100%);
  --win:#000;--win-b:transparent;--win-r:30px;--win-sh:0 20px 50px rgba(0,0,0,.28);--blur:none;
  --tx:#fff;--tx2:rgba(255,255,255,.62);--tx3:rgba(255,255,255,.4);--hair:rgba(255,255,255,.08);--hov:#141416;--sel:#1c1c1e;--raise:#111113;
  --acc:#0a84ff;--amb:#ffd60a;--red:#ff453a;--grn:#30d158;--pur:#bf5af2;--clay:#ff9f0a;
  --chip:#1c1c1e;--chip-b:transparent;--chip-r:999px;--card:#111113;--card-b:transparent;--card-r:22px;--row-r:16px;
  --in:#1c1c1e;--in-b:transparent;--in-r:999px;--bar:#000;--bar-r:999px;--tile-r:999px;
  --btn:#1c1c1e;--btn-tx:#fff;--pri:#fff;--pri-tx:#000;--fs:13.5px}
/* D. Calm (Things / Granola) */
.t-calm{--tip-tx:#fff;--wall:linear-gradient(160deg,#efe9df 0%,#e7dfd2 100%);
  --head:ui-serif,"New York",Georgia,serif;
  --win:#fbfaf7;--win-b:#e6e1d8;--win-r:14px;--win-sh:0 1px 2px rgba(60,50,30,.06),0 20px 50px rgba(60,50,30,.14);--blur:none;
  --tx:#2b2a27;--tx2:#6f6c65;--tx3:#a19d95;--hair:#ece8e0;--hov:#f3f0ea;--sel:#fff;--raise:#fff;
  --acc:#3f6fd1;--amb:#c27a1c;--red:#c4483b;--grn:#3f8f5a;--pur:#7d5bc4;--clay:#c2683f;
  --chip:#fff;--chip-b:#e6e1d8;--chip-r:8px;--card:#fff;--card-b:#ece8e0;--card-r:12px;--row-r:8px;
  --in:#fff;--in-b:#e6e1d8;--in-r:12px;--bar:#fbfaf7;--bar-r:16px;--tile-r:10px;
  --btn:#fff;--btn-tx:#2b2a27;--pri:#2b2a27;--pri-tx:#fbfaf7;--fs:13.5px}
/* E. Terminal */
.t-term{--wall:#070707;--font:var(--mono);--head:var(--mono);
  --win:#0e0e0e;--win-b:#262626;--win-r:6px;--win-sh:0 20px 60px rgba(0,0,0,.6);--blur:none;
  --tx:#d4d4d4;--tx2:#8a8a8a;--tx3:#5a5a5a;--hair:#1f1f1f;--hov:#161616;--sel:#1a1a1a;--raise:#121212;
  --acc:#7aa2f7;--amb:#e5b450;--red:#f7768e;--grn:#9ece6a;--pur:#bb9af7;--clay:#d97757;
  --chip:transparent;--chip-b:#2e2e2e;--chip-r:3px;--card:transparent;--card-b:transparent;--card-r:0;--row-r:3px;
  --in:transparent;--in-b:#2e2e2e;--in-r:3px;--bar:#0e0e0e;--bar-r:6px;--tile-r:3px;
  --btn:transparent;--btn-tx:#d4d4d4;--pri:#d4d4d4;--pri-tx:#0e0e0e;--fs:12px}

/* ---------- Desktop ---------- */
.desk{position:relative;width:1240px;height:760px;background:var(--wall);overflow:hidden;font-family:var(--font);font-size:var(--fs);color:var(--tx);-webkit-font-smoothing:antialiased}
.desk .menubar{position:absolute;left:0;right:0;top:0;height:28px;background:rgba(255,255,255,.18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;gap:18px;padding:0 16px;font:13px -apple-system,system-ui;color:rgba(0,0,0,.8)}
.t-current .menubar,.t-glass:not(.light) .menubar,.t-precise:not(.light) .menubar,.t-term .menubar{background:rgba(0,0,0,.25);color:rgba(255,255,255,.85)}
.menubar .r{margin-left:auto;display:flex;gap:14px}
.ghost{position:absolute;background:rgba(245,245,247,.92);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.25);overflow:hidden}
.t-precise:not(.light) .ghost,.t-term .ghost{background:#17171a}
.ghost .gt{height:32px;border-bottom:1px solid rgba(0,0,0,.06);display:flex;align-items:center;padding:0 12px;gap:6px}
.ghost .gl{height:10px;border-radius:5px;background:rgba(0,0,0,.08);margin:14px 18px}
.t-precise:not(.light) .ghost .gl,.t-term .ghost .gl{background:rgba(255,255,255,.05)}
.dots{display:flex;gap:7px}.dots i{width:12px;height:12px;border-radius:50%;display:block;background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.t-term .dots i{background:#2e2e2e!important}

/* ---------- Surfaces ---------- */
.win{position:absolute;background:var(--win);border:.5px solid var(--win-b);border-radius:var(--win-r);box-shadow:var(--win-sh);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);overflow:hidden;display:flex;flex-direction:column}
.t-current .win{border-width:1px}
.hdr{font-family:var(--head)}
.t-calm .hdr{font-weight:600;letter-spacing:-.01em}
.t-term .hdr{font-weight:400;color:var(--tx2)}
.tx2{color:var(--tx2)}.tx3{color:var(--tx3)}
.num{font-variant-numeric:tabular-nums}
.ic{font-size:16px;line-height:1}
.hair{height:1px;background:var(--hair);flex:none}
.grow{flex:1;min-height:0}
.row{display:flex;align-items:center;gap:10px}
.kbd{font:11px var(--mono);color:var(--tx3);border:1px solid var(--hair);border-radius:4px;padding:0 4px;line-height:16px}
.t-island .kbd,.t-calm .kbd,.t-glass .kbd{display:none}

/* Marks (status dots / glyphs) */
.mk{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block;background:var(--c)}
.mk.q{--c:var(--amb)}.mk.p{--c:var(--pur)}.mk.d{--c:var(--acc)}.mk.s{--c:var(--red)}.mk.w{--c:var(--clay)}.mk.g{--c:var(--grn)}.mk.n{--c:var(--tx3)}
.mk.w.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.t-term .mk{width:auto;height:auto;background:none;border-radius:0;color:var(--c);font:12px var(--mono);line-height:1}
.t-term .mk.q::before{content:"?"}.t-term .mk.p::before{content:"≡"}.t-term .mk.d::before{content:"✓"}.t-term .mk.s::before{content:"!"}.t-term .mk.w::before{content:"●"}.t-term .mk.g::before{content:"✓"}.t-term .mk.n::before{content:"·"}

/* Kind tag */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--c);letter-spacing:.01em}
.tag.q{--c:var(--amb)}.tag.p{--c:var(--pur)}.tag.d{--c:var(--acc)}.tag.s{--c:var(--red)}
.t-current .tag{background:color-mix(in srgb,var(--c) 16%,transparent);padding:2px 7px;border-radius:6px}
.t-glass .tag{background:color-mix(in srgb,var(--c) 22%,transparent);padding:2px 8px;border-radius:999px}
.t-island .tag{font-size:11.5px}
.t-calm .tag{font-weight:500;font-size:11.5px}
.t-precise .tag{font-weight:500;color:var(--tx2)}.t-precise .tag .mk{display:inline-block}
.t-term .tag{font-weight:400;text-transform:lowercase}
.tag .mk{display:none}.t-precise .tag .mk,.t-calm .tag .mk{display:inline-block;width:6px;height:6px}

/* Buttons and chips */
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:8px;background:var(--btn);color:var(--btn-tx);font-weight:500;font-size:12.5px;border:.5px solid var(--chip-b);white-space:nowrap}
.btn.pri{background:var(--pri);color:var(--pri-tx);border-color:transparent}
.btn.gh{background:transparent;border-color:transparent;color:var(--tx2)}
.t-glass .btn,.t-island .btn{border-radius:999px;height:30px;padding:0 14px}
.t-calm .btn{box-shadow:0 1px 1px rgba(60,50,30,.05)}
.t-term .btn{border:1px solid #2e2e2e;border-radius:3px;font-weight:400;height:24px;padding:0 8px}
.t-term .btn.pri{border-color:var(--tx)}
.t-term .btn::before{content:"["}.t-term .btn::after{content:"]"}.t-term .btn{gap:2px}
.t-term .btn.pri::before,.t-term .btn.pri::after{content:""}
.ib{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--tx2)}
.ib.on{background:var(--sel);color:var(--tx)}
.t-precise .ib,.t-term .ib{border-radius:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:var(--chip-r);background:var(--chip);border:.5px solid var(--chip-b);font-size:12.5px;color:var(--tx);white-space:nowrap}
.chip small{color:var(--tx3);font-size:11px}
.chip.on{background:color-mix(in srgb,var(--acc) 22%,transparent);border-color:color-mix(in srgb,var(--acc) 55%,transparent)}
.t-precise .chip{padding:4px 9px}
.t-island .chip{padding:8px 14px;font-size:13px}
.t-term .chip{border-width:1px}
.t-term .chip.on{background:none;border-color:var(--acc);color:var(--acc)}
.cnt{font-size:11px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:var(--chip);color:var(--tx2)}
.cnt.amb{background:var(--amb);color:#2a1d00}
.t-term .cnt{background:none;font-weight:400}.t-term .cnt::before{content:"("}.t-term .cnt::after{content:")"}.t-term .cnt.amb{color:var(--amb)}
.seg2{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--chip)}
.seg2 span{padding:3px 10px;border-radius:7px;font-size:12px;color:var(--tx2);display:inline-flex;gap:6px;align-items:center}
.seg2 span.on{background:var(--sel);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.t-glass .seg2,.t-island .seg2{border-radius:999px}.t-glass .seg2 span,.t-island .seg2 span{border-radius:999px}
.t-term .seg2{background:none;padding:0;gap:12px}.t-term .seg2 span{padding:0}.t-term .seg2 span.on{background:none;box-shadow:none;text-decoration:underline;text-underline-offset:4px}

/* Inputs */
.field{display:flex;align-items:center;gap:8px;background:var(--in);border:.5px solid var(--in-b);border-radius:var(--in-r);padding:8px 12px;color:var(--tx3)}
.t-term .field{border-width:1px}

/* Avatars & tiles */
.av{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;position:relative}
.av em{position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:50%;border:2px solid var(--win);background:var(--c)}
.t-term .av{border-radius:3px;width:22px;height:22px;font-size:10px}
.t-precise .av{width:22px;height:22px;font-size:10px}
.tile{width:34px;height:34px;border-radius:var(--tile-r);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;position:relative;background:var(--chip);color:var(--tx2)}
.tile.amb{background:var(--amb);color:#2a1d00}
.tile .bdg{position:absolute;top:-5px;right:-6px;font-size:10px;min-width:16px;height:16px;border-radius:8px;background:var(--tx);color:var(--tip-tx,#111);display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700}
.t-term .tile{border:1px solid #2e2e2e;background:none}.t-term .tile.amb{color:var(--amb);border-color:var(--amb)}

/* Edge bar */
.bar{position:absolute;right:0;top:120px;width:58px;background:var(--bar);border:.5px solid var(--win-b);border-right:none;border-radius:var(--bar-r) 0 0 var(--bar-r);box-shadow:var(--win-sh);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:10px}
.bar .sep{width:26px;height:1px;background:var(--hair)}
.bar .stat{font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px}
.t-precise .bar{width:46px;gap:8px}.t-precise .bar .tile{width:28px;height:28px;font-size:11px}
.t-calm .bar{width:54px}
.t-term .bar{width:52px;font-size:11px}
/* Island notch */
.notch{position:absolute;left:50%;top:0;transform:translateX(-50%);background:#000;color:#fff;border-radius:0 0 22px 22px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;height:34px;min-width:330px;gap:14px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.notch .cam{width:160px}

/* Lists */
.li{display:flex;gap:10px;padding:8px 10px;border-radius:var(--row-r);align-items:flex-start}
.li.sel{background:var(--sel)}
.li .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .m{font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tm{font-size:11.5px;color:var(--tx3);margin-left:auto;flex:none;font-variant-numeric:tabular-nums}
.t-precise .li{padding:6px 10px}
.t-island .li{padding:10px 12px}
.t-term .li .t{font-weight:400}

/* Cards */
.card{background:var(--card);border:.5px solid var(--card-b);border-radius:var(--card-r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card.sel{outline:2px solid color-mix(in srgb,var(--acc) 70%,transparent);outline-offset:-1px}
.t-current .card{border-bottom:1px solid var(--hair);border-radius:0;padding:14px 4px}
.t-current .card.sel{outline:none;background:var(--raise);border-radius:12px;padding:14px 12px;border-color:transparent}
.t-precise .card{border-bottom:1px solid var(--hair);padding:12px 16px}
.t-precise .card.sel{outline:none;background:var(--sel);box-shadow:inset 2px 0 0 var(--acc)}
.t-calm .card{box-shadow:0 1px 2px rgba(60,50,30,.05)}
.t-calm .card.sel{outline:none;box-shadow:0 0 0 1.5px var(--tx),0 4px 14px rgba(60,50,30,.08)}
.t-island .card{padding:16px 18px;gap:10px}
.t-island .card.sel{outline:none;background:#1c1c1e}
.t-term .card{border-left:1px solid #2e2e2e;padding:6px 0 6px 12px;gap:6px}
.t-term .card.sel{outline:none;border-left-color:var(--tx)}
.card .ttl{font-weight:600;font-size:13.5px}
.t-precise .card .ttl{font-weight:500;font-size:13px}
.t-term .card .ttl{font-weight:400;font-size:12px}
.t-island .card .ttl{font-size:15px}
.t-calm .card .ttl{font-family:var(--head);font-size:15px;font-weight:600}
.card .body{color:var(--tx2);font-size:12.5px}
.t-island .card .body{font-size:14px;color:var(--tx)}
.card .acts{display:flex;gap:6px;align-items:center}
.plan{margin:2px 0 0 0;padding-left:18px;color:var(--tx2);font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.t-term .plan{list-style:none;padding-left:0}.t-term .plan li::before{content:"  - "}

/* Chat */
.msg{max-width:78%;font-size:13px;line-height:1.5}
.msg.you{align-self:flex-end;background:var(--sel);padding:8px 12px;border-radius:14px}
.t-current .msg.you{background:var(--acc);color:#fff;border-radius:14px 14px 4px 14px}
.t-glass .msg.you{background:var(--acc);color:#fff;border-radius:18px}
.t-island .msg.you{background:#1c1c1e;border-radius:20px;padding:10px 14px}
.t-calm .msg.you{background:#f0ece4;border-radius:12px}
.t-precise .msg.you{background:var(--raise);border:1px solid var(--hair);border-radius:8px}
.t-term .msg.you{background:none;padding:0;align-self:flex-start;max-width:100%;color:var(--tx)}.t-term .msg.you::before{content:"› ";color:var(--clay)}
.msg.rt{align-self:flex-start}
.t-calm .msg.rt{font-family:var(--head);font-size:14.5px;line-height:1.55}
.msg .at{color:var(--acc);font-weight:500}
.t-current .msg.you .at,.t-glass .msg.you .at{color:#fff;text-decoration:underline;text-underline-offset:2px}
.rcpt{align-self:flex-start;display:flex;gap:10px;font-size:12px;color:var(--tx2);padding:8px 12px;border-radius:10px;border:.5px solid var(--hair);background:var(--raise);max-width:80%}
.rcpt .ic{color:var(--grn);font-size:15px}
.t-term .rcpt{border:none;background:none;padding:0}
.peer{align-self:flex-start;border-left:2px solid var(--clay);padding:2px 0 2px 12px;font-size:13px;max-width:80%}
.peer .from{font-size:11.5px;color:var(--tx3);font-weight:600;margin-bottom:2px}
.t-calm .peer{background:#fff;border:1px solid var(--hair);border-left:3px solid var(--clay);border-radius:0;padding:8px 12px}
.t-island .peer{border-left:none;background:#111113;border-radius:18px;padding:10px 14px}
.daysep{align-self:center;font-size:11px;color:var(--tx3)}

/* Composer */
.comp{border:.5px solid var(--in-b);background:var(--in);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;position:relative}
.t-glass .comp,.t-island .comp{border-radius:22px}
.t-precise .comp{border-radius:8px}
.t-term .comp{border-radius:0;border:none;border-top:1px solid var(--hair);background:none;padding:10px 0 0}
.comp .send{width:26px;height:26px;border-radius:50%;background:var(--pri);color:var(--pri-tx);display:flex;align-items:center;justify-content:center;margin-left:auto}
.t-precise .comp .send,.t-term .comp .send{border-radius:6px}
.t-term .comp .send{display:none}
.caret{display:inline-block;width:1.5px;height:15px;background:var(--acc);vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pop{position:absolute;left:10px;bottom:calc(100% + 6px);width:240px;background:var(--win);border:.5px solid var(--win-b);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.3);padding:5px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.t-glass .pop{background:rgba(40,40,48,.7)}.t-glass.light .pop{background:rgba(255,255,255,.8)}
.t-island .pop{border-radius:20px;background:#111113}
.t-term .pop{border-radius:0;border:1px solid #2e2e2e;box-shadow:none}

/* Banner */
.banner{position:absolute;right:16px;top:40px;width:340px;padding:12px 14px;display:flex;gap:11px;border-radius:18px;background:var(--win);border:.5px solid var(--win-b);box-shadow:var(--win-sh);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.t-precise .banner{border-radius:12px}.t-term .banner{border-radius:4px}
.banner .appic{width:36px;height:36px;border-radius:9px;background:var(--tx);color:var(--tip-tx,#111);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}

/* Labels over scenes */
.callout{position:absolute;font:11.5px -apple-system,system-ui;color:#fff;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:6px;backdrop-filter:blur(8px)}

/* Components sheet */
.sheet{position:absolute;inset:44px 36px 36px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.sheet .win{position:relative;padding:16px;gap:12px}
.sheet h4{font-family:var(--head);font-size:11px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.07em}
.t-calm .sheet h4{text-transform:none;letter-spacing:0;font-size:13px;color:var(--tx2)}
.t-term .sheet h4{text-transform:lowercase;letter-spacing:0;font-weight:400}.t-term .sheet h4::before{content:"# "}
.wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tog{width:34px;height:20px;border-radius:10px;background:var(--grn);position:relative;flex:none}
.tog::after{content:"";position:absolute;right:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tog.off{background:var(--chip)}.tog.off::after{right:auto;left:2px}
.t-precise .tog{background:var(--acc)}
.t-term .tog{background:none;border:1px solid var(--grn);border-radius:2px;width:auto;height:auto;padding:0 4px;color:var(--grn);font-size:11px}
.t-term .tog::after{content:"on";position:static;background:none;box-shadow:none;width:auto;height:auto}
.t-term .tog.off{border-color:#2e2e2e;color:var(--tx3)}.t-term .tog.off::after{content:"off"}
.tip{display:inline-flex;flex-direction:column;gap:1px;background:var(--tx);color:var(--tip-tx,#111);padding:6px 9px;border-radius:8px;font-size:12px}
.tip small{opacity:.6;font-size:11px}
</style>
</head>
<body>
<div class="top">
  <b>Lookout redesign</b>
  <span class="lbl">Direction</span>
  <div class="seg" id="dirs"></div>
  <span class="lbl">Router layout</span>
  <div class="seg" id="lays"></div>
  <span class="lbl">Appearance</span>
  <div class="seg" id="mode"><button data-m="dark" class="on">Dark</button><button data-m="light">Light</button></div>
  <span class="lbl">View</span>
  <div class="seg" id="views"><button data-v="one" class="on">All screens</button><button data-v="cmp">Compare Router</button></div>
</div>
<main id="main"></main>

<script>
/* ---------------- Data (mirrors the app's real content) ---------------- */
const DIRS = [
  {k:'current', n:'Today', d:'Lookout as it ships now, for reference: near-black, a lot of colour, filled tiles.', refs:''},
  {k:'glass', n:'A · Liquid Glass', d:'macOS 26 materials: translucent, blurred panels, capsule controls, system colours. It looks like part of macOS (Control Center, Alcove).', refs:'Alcove · Control Center · macOS 26', light:true},
  {k:'precise', n:'B · Precision', d:'Raycast / Linear: almost black, hairline borders, one accent colour, dense rows, keyboard hints everywhere. Fast and serious.', refs:'Raycast · Linear · Vercel', light:true},
  {k:'island', n:'C · Island', d:'The bar becomes a black pill around the notch that grows into place. Pure black surfaces, large radii, roomy type. It looks like hardware.', refs:'Dynamic Island · Alcove · NotchNook'},
  {k:'calm', n:'D · Calm', d:'Things / Granola: warm paper, soft cards, serif headings, very little colour. It reads like a notebook, not a dashboard.', refs:'Things 3 · Granola · Notion Calendar'},
  {k:'term', n:'E · Terminal', d:'Zed / Ghostty: monospace throughout, glyphs instead of badges, no boxes. It looks like Claude Code itself.', refs:'Zed · Ghostty · Claude Code'},
];
const LAYS = [
  {k:'split', n:'1 · Cards | Chat', d:'Today\'s layout: open cards on the left, the chat on the right.'},
  {k:'inbox', n:'2 · Inbox', d:'A compact list on the left; the selected card opens in full above the chat, as in Superhuman or the Linear inbox.'},
  {k:'stream', n:'3 · Stream', d:'One column: cards arrive as messages in the conversation and stay pinned until handled, as in the Claude and ChatGPT apps.'},
  {k:'palette', n:'4 · Palette', d:'A transient ⌥R panel, Raycast-style: type to filter or tell the Router, with a preview on the right. Closes once you\'re done.'},
];
const P = {api:'#30a46c', lookout:'#8e4ec6', lcu:'#d6409f', zig:'#0090ff', web:'#e5484d'};
const CARDS = [
  {k:'q', label:'Question', title:'Database migration plan', proj:'api-server', ago:'2m',
    text:'Which database should the new jobs table live in?',
    opts:[['Postgres','already in the stack'],['SQLite','single file'],['Redis','fast, not durable']]},
  {k:'p', label:'Plan', title:'Update notifications', proj:'lcu', ago:'9m', text:'Plan ready for approval · 4 steps',
    plan:['Poll releases hourly and on wake','Ask before installing, with "Always"','Verify the signature before swapping','Tests for the prompt and the rollback']},
  {k:'s', label:'Stuck', title:'Landing page', proj:'web', ago:'14m', text:'The build needs STRIPE_KEY and it isn\'t set in this shell.'},
  {k:'d', label:'Done', title:'CI failure diagnosis', proj:'lookout', ago:'4m', text:'Fixed the flaky sandbox test; CI is green on the branch.', running:3},
];
const WORK = [
  ['zig','std.Io vectored reads','Running zig build test','12m'],
  ['lookout','CI failure diagnosis','3 left running',''],
];
const STATUS = '2 working · zig: Running zig build test 12m · api-server: waiting on you';
const INBOX = [
  ['AK','#c2410c','std.Io: add vectored reads to File','zig#21877 · Review comment · @andrewrk','3m','#e5b450'],
  ['AL','#4338ca','Respect trailing comma config in collection literals','swift-format#1042 · PR comment · @allevato','18m','#6366f1'],
  ['MT','#15803d','Pill overlaps the Dock when it\'s on the right','lookout#12 · New issue · @mattt','42m','#22c55e'],
  ['AH','#0e7490','Add --lines option to format a range','swift-format#1051 · Review requested · @ahoppen','1h','#f59e0b'],
  ['KF','#7e22ce','Add GitHub Enterprise host setting','lookout#15 · New pull request · @kylef','1h','#a855f7'],
];

/* ---------------- Helpers ---------------- */
const $ = (s,r=document)=>r.querySelector(s);
let S = {dir:'glass', lay:'split', mode:'dark', view:'one'};
const ic = (n,st='')=>`<i class="ti ti-${n} ic" style="${st}"></i>`;
const mk = (k,pulse)=>`<span class="mk ${k}${pulse?' pulse':''}"></span>`;
const tag = c=>`<span class="tag ${c.k}">${mk(c.k)}${c.label}</span>`;
const pdot = p=>`<span style="width:6px;height:6px;border-radius:50%;background:${P[p.replace('-server','')]||'#888'};display:inline-block;flex:none"></span>`;
const isTerm = ()=>S.dir==='term';
const isIsland = d=>d==='island';

function desk(dir, inner, extraCls=''){
  const light = (S.mode==='light' && DIRS.find(x=>x.k===dir).light) ? ' light':'';
  return `<div class="desk t-${dir}${light} ${extraCls}">
    <div class="menubar"><b>Claude</b><span>File</span><span>Edit</span><span>View</span><span>Window</span><div class="r"><span>${ic('wifi','font-size:14px')}</span><span>Thu 9 Oct  14:32</span></div></div>
    ${inner}</div>`;
}
function ghostApp(x,y,w,h){
  return `<div class="ghost" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><div class="gt"><div class="dots"><i></i><i></i><i></i></div></div>
  <div class="gl" style="width:40%"></div><div class="gl" style="width:72%"></div><div class="gl" style="width:60%"></div><div class="gl" style="width:30%"></div><div class="gl" style="width:66%"></div></div>`;
}

/* ---------------- Bar ---------------- */
function edgeBar(dir){
  const t = dir==='term';
  return `<div class="bar">
    <div class="tile amb">${t?'in':ic('inbox')}</div><span class="cnt">5</span>
    <div class="sep"></div>
    <div class="tile" style="color:var(--red)">${t?'ci':ic('rosette')}</div>
    <div class="stat num">${mk('s')}1</div><div class="stat num">${mk('w')}1</div><div class="stat num">${mk('g')}2</div>
    <div class="sep"></div>
    <div class="tile" style="color:var(--amb)">${t?'rt':ic('git-branch')}<span class="bdg">4</span></div>
    <div class="stat" style="font-weight:400;color:var(--tx3);font-size:11px">${mk('w',1)}2</div>
    <div class="sep"></div>
    <div class="ib">${t?'⚙':ic('settings')}</div>
  </div>`;
}
function notch(expanded){
  if(!expanded) return `<div class="notch"><span class="row" style="gap:7px">${mk('q')}<span>api-server asks</span></span><span class="cam"></span><span class="row" style="gap:10px;color:rgba(255,255,255,.6)"><span class="row" style="gap:5px">${mk('w',1)}2</span><span class="row" style="gap:5px">${ic('inbox','font-size:14px')}5</span></span></div>`;
  return '';
}

/* ---------------- Router panel (hover) ---------------- */
function routerPanelBody(dir, compact){
  const cards = CARDS.slice(0,3).map(c=>`
    <div class="li">${mk(c.k)}<div style="min-width:0;flex:1"><div class="row" style="gap:8px"><span class="t">${c.title}</span><span class="tm">${c.ago}</span></div>
    <div class="m">${c.proj} · ${c.text}</div></div></div>`).join('');
  const work = WORK.map(w=>`<div class="li" style="padding-top:5px;padding-bottom:5px">${mk('w',1)}<span class="t" style="font-weight:400">${w[1]}</span><span class="m" style="margin-left:auto">${w[2]}${w[3]?' · '+w[3]:''}</span></div>`).join('');
  return `<div style="padding:14px 16px 8px" class="row"><span class="hdr" style="font-weight:600;font-size:${dir==='island'?16:14}px">For you</span><span class="cnt amb">4</span><span style="margin-left:auto" class="tx3 row" style="gap:6px"><span class="kbd">⌃⌥R</span></span></div>
    <div style="padding:0 6px">${cards}</div>
    <div class="li tx3" style="padding:2px 16px 10px;font-size:12px">1 more in the Router</div>
    <div class="hair"></div>
    <div style="padding:10px 16px 4px" class="tx3 hdr">${dir==='term'?'running':'Working'}</div>
    <div style="padding:0 6px 10px">${work}</div>`;
}
function sceneHover(dir){
  if(isIsland(dir)){
    return desk(dir, ghostApp(120,90,560,420) + ghostApp(620,200,500,380) + `
      <div class="win" style="left:50%;transform:translateX(-50%);top:0;width:500px;border-radius:0 0 34px 34px;padding-top:30px">
        <div class="row" style="justify-content:space-between;padding:0 20px 6px;font-size:12px" class="tx2"><span class="row tx2" style="gap:6px">${mk('w',1)} ${STATUS.split(' · ')[0]}</span><span class="tx3">⌃⌥R to open</span></div>
        ${routerPanelBody(dir)}
      </div>
      <div class="callout" style="left:50%;transform:translateX(calc(250px + 16px));top:46px">The notch grows on hover, no window</div>`);
  }
  return desk(dir, ghostApp(80,90,640,460) + edgeBar(dir) + `
    <div class="win" style="right:66px;top:250px;width:420px">${routerPanelBody(dir)}</div>
    <div class="callout" style="right:66px;top:222px">Hovering the Router tile</div>`);
}
function sceneRest(dir){
  const banner = `<div class="banner" ${isIsland(dir)?'style="display:none"':''}><div class="appic">${ic('git-branch')}</div><div style="min-width:0"><div class="row"><b style="font-weight:600">api-server asks</b><span class="tx3" style="margin-left:auto;font-size:11px">now</span></div><div class="tx2" style="font-size:12.5px">Which database should the new jobs table live in?</div><div class="row" style="gap:6px;margin-top:8px"><span class="chip">Postgres</span><span class="chip">SQLite</span><span class="chip">Reply…</span></div></div></div>`;
  if(isIsland(dir)){
    return desk(dir, ghostApp(120,90,560,420)+ghostApp(620,200,500,380)+notch(false)+`
      <div class="win" style="left:50%;transform:translateX(-50%);top:0;width:430px;border-radius:0 0 32px 32px;padding:42px 20px 18px;top:380px;position:absolute;border-radius:32px;padding-top:18px">
        <div class="row" style="gap:8px">${mk('q')}<b>api-server asks</b><span class="tx3" style="margin-left:auto;font-size:12px">now</span></div>
        <div style="font-size:15px;margin:8px 0 12px">Which database should the new jobs table live in?</div>
        <div class="row" style="gap:6px"><span class="chip">Postgres</span><span class="chip">SQLite</span><span class="chip">Redis</span><span class="chip tx2" style="margin-left:auto">Reply</span></div>
      </div>
      <div class="callout" style="left:50%;transform:translateX(-50%);top:44px">At rest: the notch shows the top thing and the counts</div>
      <div class="callout" style="left:50%;transform:translateX(-50%);top:352px">When a question arrives the island drops down for a few seconds, instead of a system banner (shown here away from the notch)</div>`);
  }
  return desk(dir, ghostApp(80,90,640,460)+edgeBar(dir)+banner+`
    <div class="callout" style="right:66px;top:96px">The bar at rest (Router only)</div>`);
}

/* ---------------- Hub (kept open) ---------------- */
function sceneHub(dir){
  const isl = isIsland(dir);
  const rows = INBOX.map((r,i)=>`<div class="li${i==1?' sel':''}">${isTerm()?mk('q'):''}<div class="av" style="background:${r[1]}">${r[0]}<em style="--c:${r[5]}"></em></div>
    <div style="min-width:0;flex:1"><div class="row"><span class="t">${r[2]}</span><span class="tm">${r[4]}</span></div><div class="m">${r[3]}</div></div></div>`).join('');
  const ci = [['s','Failing','swift-format','2 checks'],['w','Running','zig',''],['g','Passing','lookout · lcu','']].map(c=>`<div class="row" style="padding:5px 16px;gap:10px">${mk(c[0])}<span style="width:62px;color:var(--tx2)">${c[1]}</span><span>${c[2]}</span>${c[3]?`<span style="color:var(--red);font-size:12px">${c[3]}</span>`:''}</div>`).join('');
  const W = isl?520:470;
  const panel = `
    <div style="padding:${isl?'16px 18px 8px':'12px 12px 6px'}" class="row"><span class="seg2"><span class="on">Needs you <span class="cnt amb">5</span></span><span>Bots <span class="cnt">2</span></span><span>Done</span></span><span style="margin-left:auto" class="row"><span class="ib">${ic('checks')}</span><span class="ib">${ic('arrows-maximize')}</span></span></div>
    <div style="padding:0 6px">${rows}</div>
    <div class="hair" style="margin-top:6px"></div>
    <div class="row" style="padding:12px 16px 6px"><span class="hdr" style="font-weight:600">CI</span><span style="color:var(--red);font-size:12px">1 failing</span></div>
    ${ci}
    <div class="hair" style="margin-top:8px"></div>
    <div class="row" style="padding:12px 16px 4px"><span class="hdr" style="font-weight:600">Router</span><span style="color:var(--amb);font-size:12px">4 open</span><span class="tx3 row" style="margin-left:auto;font-size:12px;gap:6px">Open window <span class="kbd">⌃⌥R</span></span></div>
    <div style="padding:0 6px">${CARDS.slice(0,2).map(c=>`<div class="li">${mk(c.k)}<div style="min-width:0;flex:1"><div class="row"><span class="t">${c.title}</span><span class="tm">${c.ago}</span></div><div class="m">${c.proj} · ${c.text}</div></div></div>`).join('')}</div>
    <div class="row" style="padding:2px 16px 10px;gap:8px;font-size:12px" class="tx2">${mk('w',1)}<span class="tx2">${STATUS}</span></div>
    <div class="grow"></div><div class="hair"></div>
    <div class="row" style="padding:10px 14px"><span class="row tx2" style="gap:6px;font-size:12px">${mk('g')}Up to date</span><span style="margin-left:auto" class="row"><span class="ib on">${ic('pin')}</span><span class="ib">${ic('stack-2')}</span><span class="ib">${ic('settings')}</span></span></div>`;
  if(isl) return desk(dir, ghostApp(80,90,640,460)+`<div class="win" style="left:50%;transform:translateX(-50%);top:0;width:${W}px;height:740px;border-radius:0 0 36px 36px;padding-top:26px">${panel}</div>
    <div class="callout" style="left:calc(50% + ${W/2+14}px);top:60px">Kept open (⌃⌥L): the island at full height</div>`);
  return desk(dir, ghostApp(60,90,560,460)+edgeBar(dir)+`<div class="win" style="right:66px;top:40px;width:${W}px;height:700px">${panel}</div>
    <div class="callout" style="right:${66+W+12}px;top:40px">Kept open (⌃⌥L)</div>`);
}

/* ---------------- Router window pieces ---------------- */
function cardFull(c, sel, opts={}){
  const isl = S.dir==='island';
  let extra='';
  if(c.k==='q') extra = `<div class="wrap">${c.opts.map((o,i)=>`<span class="chip${i==0&&opts.picked?' on':''}">${o[0]}${isl||S.dir==='calm'?'':` <small>${o[1]}</small>`}</span>`).join('')}<span class="chip tx3" style="color:var(--tx3)">Other…</span></div>
     <div class="acts"><span class="btn pri">Send answer</span><span class="btn gh">${ic('arrow-back-up','font-size:14px')}Reply</span><span class="btn gh">Open</span><span class="kbd" style="margin-left:auto">↵</span></div>`;
  if(c.k==='p') extra = `<ol class="plan">${c.plan.map(p=>`<li>${p}</li>`).join('')}</ol><div class="acts"><span class="btn pri">Approve</span><span class="btn">Keep planning</span><span class="btn gh">Open</span></div>`;
  if(c.k==='s') extra = `<div class="acts"><span class="btn">${ic('arrow-back-up','font-size:14px')}Reply</span><span class="btn gh">Open</span></div>`;
  if(c.k==='d') extra = `<div class="row" style="gap:6px;font-size:12px;color:var(--clay)">${mk('w',1)} ${c.running} still running: swift test, 2 subagents</div><div class="acts"><span class="btn">${ic('check','font-size:14px')}Mark addressed</span><span class="btn gh">Open</span></div>`;
  return `<div class="card${sel?' sel':''}">
    <div class="row" style="gap:8px">${tag(c)}<span class="tx3 row" style="gap:6px;font-size:12px">${pdot(c.proj)}${c.proj}</span><span class="tm tx3" style="margin-left:auto;font-size:11.5px">${c.ago}</span></div>
    <div class="ttl">${c.title}</div>
    <div class="body">${c.text}</div>${extra}</div>`;
}
function chat(opts={}){
  const t=S.dir==='term';
  return `
   <div class="daysep">Today</div>
   <div class="msg you">what needs me?</div>
   <div class="msg rt">Three things. <b>api-server</b> asks which database the jobs table should use, <b>lcu</b> has a plan waiting for approval, and <b>web</b> is stuck on a missing STRIPE_KEY. lookout finished; CI is green.</div>
   <div class="msg you"><span class="at">@api-server</span> go with postgres, keep the migration reversible</div>
   <div class="rcpt">${ic('circle-check')}<div><div style="color:var(--tx)">Sent to <b style="font-weight:600">Database migration plan</b> · api-server</div><div>“Go with Postgres, keep the migration reversible.”</div></div></div>
   <div class="peer"><div class="from">From CI failure diagnosis · lookout</div>Pushed the fix to ci-sandbox. Want me to open a PR?</div>
   ${opts.more||''}`;
}
function composer(withPop){
  const pop = withPop?`<div class="pop">
    <div class="li sel" style="padding:6px 10px">${pdot('lookout')}<span class="t">@lookout</span><span class="tm">1 open</span></div>
    <div class="li" style="padding:6px 10px">${pdot('lcu')}<span class="t">@lcu</span><span class="tm">plan</span></div>
    <div class="li tx3" style="padding:6px 10px;font-size:12px">${ic('plus','font-size:13px')} New session in…</div></div>`:'';
  return `<div class="comp">${pop}
    <div style="min-height:20px">${withPop?'<span class="at" style="color:var(--acc)">@l</span><span class="caret"></span>':'<span class="tx3">Tell the Router…</span>'}</div>
    <div class="row" style="gap:6px"><span class="ib" style="width:24px;height:24px">${ic('at','font-size:15px')}</span><span class="tx3" style="font-size:11.5px">${isTerm()?'↵ send · @ tag a project · ⌘↵ reply to card':'Replying to nothing · @ to tag a project'}</span><span class="send">${ic('arrow-up','font-size:15px')}</span></div></div>`;
}
function titlebar(title, right=''){
  const isl=S.dir==='island';
  return `<div class="row" style="height:${isl?52:44}px;padding:0 ${isl?22:14}px;flex:none;gap:12px">${isl?'':'<div class="dots"><i></i><i></i><i></i></div>'}<span class="hdr" style="font-weight:600;font-size:${isl?15:13}px">${title}</span>${right}</div>`;
}
function routerWin(dir, lay, w=1000, h=640){
  const isl = isIsland(dir);
  const statusRight = `<span class="row tx2" style="margin-left:auto;gap:7px;font-size:12px">${mk('w',1)}${STATUS}</span>`;
  let body='';
  if(lay==='split'){
    body = titlebar('Router', statusRight) + `<div class="hair"></div>
      <div style="display:flex;flex:1;min-height:0">
        <div style="width:410px;border-right:1px solid var(--hair);display:flex;flex-direction:column;min-height:0">
          <div class="row" style="padding:12px 16px"><span class="hdr" style="font-weight:600;font-size:${isl?17:15}px">For you</span><span class="seg2" style="margin-left:auto"><span class="on">Open <span class="cnt amb">4</span></span><span>All</span></span></div>
          <div style="display:flex;flex-direction:column;gap:${['glass','calm','island'].includes(dir)?10:0}px;padding:0 ${['glass','calm','island','current'].includes(dir)?12:0}px 12px;overflow:hidden">
            ${CARDS.map((c,i)=>cardFull(c,i==0)).join('')}
          </div></div>
        <div style="flex:1;display:flex;flex-direction:column;min-width:0">
          <div style="flex:1;display:flex;flex-direction:column;gap:14px;padding:18px 22px;overflow:hidden;justify-content:flex-end">${chat()}</div>
          <div style="padding:0 18px 16px">${composer(true)}</div></div></div>`;
  }
  if(lay==='inbox'){
    const list = CARDS.map((c,i)=>`<div class="li${i==0?' sel':''}">${mk(c.k)}<div style="min-width:0;flex:1"><div class="row"><span class="t">${c.title}</span><span class="tm">${c.ago}</span></div><div class="m">${c.proj} · ${c.label}</div></div></div>`).join('')
      + `<div class="tx3 hdr" style="padding:14px 12px 4px;font-size:11.5px">${isTerm()?'running':'Working'}</div>`
      + WORK.map(w=>`<div class="li">${mk('w',1)}<div style="min-width:0;flex:1"><div class="t" style="font-weight:400">${w[1]}</div><div class="m">${w[0]} · ${w[2]}</div></div></div>`).join('')
      + `<div class="tx3 hdr" style="padding:14px 12px 4px;font-size:11.5px">Addressed</div><div class="li tx3">${mk('n')}<div style="min-width:0;flex:1"><div class="t" style="font-weight:400">Repository transfer</div><div class="m">You replied · 3h</div></div></div>`;
    const c = CARDS[0];
    body = titlebar('Router', statusRight)+`<div class="hair"></div>
      <div style="display:flex;flex:1;min-height:0">
        <div style="width:280px;border-right:1px solid var(--hair);padding:10px 8px;display:flex;flex-direction:column;overflow:hidden">
          <div class="field" style="margin:0 4px 10px;padding:6px 10px">${ic('search','font-size:14px')}<span style="font-size:12.5px">Search</span><span class="kbd" style="margin-left:auto">⌘F</span></div>${list}</div>
        <div style="flex:1;display:flex;flex-direction:column;min-width:0">
          <div style="padding:22px 26px 18px;border-bottom:1px solid var(--hair)">
            <div class="row" style="gap:8px;margin-bottom:8px">${tag(c)}<span class="tx3 row" style="gap:6px;font-size:12px">${pdot(c.proj)}${c.proj} · ${c.ago}</span><span class="row" style="margin-left:auto;gap:2px"><span class="ib">${ic('external-link')}</span><span class="ib">${ic('check')}</span></span></div>
            <div class="hdr" style="font-size:${isl?22:19}px;font-weight:600;letter-spacing:-.01em">${c.text}</div>
            <div class="tx2" style="margin:4px 0 14px;font-size:12.5px">${c.title} · asked 2m ago while planning the migration</div>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${c.opts.map((o,i)=>`<div class="card${i==0?' sel':''}" style="padding:10px 12px;gap:2px;${['current','precise','term'].includes(dir)?'border:1px solid var(--hair);border-radius:8px':''}"><div style="font-weight:600">${o[0]}</div><div class="tx2" style="font-size:12px">${o[1]}</div></div>`).join('')}</div>
            <div class="row" style="gap:8px;margin-top:12px"><span class="btn pri">Send answer</span><span class="btn gh">Other…</span><span class="kbd" style="margin-left:auto">1 2 3 · ↵</span></div>
          </div>
          <div style="flex:1;display:flex;flex-direction:column;gap:12px;padding:14px 26px;overflow:hidden;justify-content:flex-end">
            <div class="msg you"><span class="at">@api-server</span> what did you already try?</div>
            <div class="rcpt">${ic('circle-check')}<div><div style="color:var(--tx)">Sent to Database migration plan</div><div>“What did you already try?”</div></div></div>
            <div class="peer"><div class="from">From Database migration plan · api-server</div>A local SQLite prototype; it works but we'd need a second migration path for prod.</div></div>
          <div style="padding:0 22px 16px">${composer(false).replace('Replying to nothing','Replying to Database migration plan')}</div></div></div>`;
  }
  if(lay==='stream'){
    const pinned = `<div class="row" style="gap:8px;padding:10px 20px;overflow:hidden;flex:none">${CARDS.map((c,i)=>`<span class="chip${i==0?' on':''}" style="gap:7px">${mk(c.k)}${c.title}<small>${c.proj}</small></span>`).join('')}</div>`;
    body = titlebar('Router', statusRight)+`<div class="hair"></div>${pinned}<div class="hair"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:14px;padding:18px 0;overflow:hidden;justify-content:flex-end;width:640px;margin:0 auto">
        <div class="msg you">what needs me?</div>
        <div class="msg rt">Three things, the newest first.</div>
        ${cardFull(CARDS[1],false)}
        ${cardFull(CARDS[0],true)}
        <div class="msg you"><span class="at">@api-server</span> postgres, keep it reversible</div>
        <div class="rcpt">${ic('circle-check')}<div><div style="color:var(--tx)">Answered <b style="font-weight:600">Database migration plan</b></div><div>Postgres · “Keep the migration reversible.”</div></div></div>
      </div>
      <div style="width:640px;margin:0 auto 16px">${composer(false)}</div>`;
  }
  if(lay==='palette'){
    const c = CARDS[0];
    const items = CARDS.map((x,i)=>`<div class="li${i==0?' sel':''}" style="align-items:center">${mk(x.k)}<span class="t">${x.title}</span><span class="tx3" style="font-size:12px">${x.proj}</span><span class="tm">${i==0?'<span class="kbd">↵</span>':x.ago}</span></div>`).join('');
    const w2=780,h2=470;
    return `<div class="win" style="left:calc(50% - ${w2/2}px);top:150px;width:${w2}px;height:${h2}px">
      <div class="row" style="padding:14px 18px;gap:10px;font-size:16px">${ic('git-branch','font-size:18px;color:var(--tx3)')}<span><span class="tx">tell api-server postgres</span><span class="caret"></span></span><span class="tx3" style="margin-left:auto;font-size:12px">${STATUS.split(' · ')[0]}</span></div>
      <div class="hair"></div>
      <div style="display:flex;flex:1;min-height:0">
        <div style="width:330px;padding:8px;border-right:1px solid var(--hair)">
          <div class="tx3 hdr" style="padding:6px 10px;font-size:11.5px">Send</div>
          <div class="li sel" style="align-items:center">${ic('send','font-size:15px;color:var(--acc)')}<span class="t">Send to api-server</span><span class="tm"><span class="kbd">↵</span></span></div>
          <div class="li" style="align-items:center">${ic('message-question','font-size:15px;color:var(--amb)')}<span class="t">Answer “Postgres”</span><span class="tm"><span class="kbd">⌘↵</span></span></div>
          <div class="tx3 hdr" style="padding:10px 10px 6px;font-size:11.5px">For you</div>
          ${items.replace(' sel','')}
        </div>
        <div style="flex:1;padding:16px;overflow:hidden">${cardFull(c,false,{picked:true})}</div>
      </div>
      <div class="hair"></div>
      <div class="row tx3" style="padding:8px 14px;font-size:11.5px;gap:14px"><span>↑↓ move</span><span>↵ send</span><span>⌘↵ answer</span><span>⇥ reply to card</span><span style="margin-left:auto">esc close</span></div>
    </div>`;
  }
  const top = isl? 0 : 40;
  const st = isl? `left:calc(50% - ${w/2}px);top:0;width:${w}px;height:${h+40}px;border-radius:0 0 40px 40px;padding-top:26px` : `left:36px;top:${top+20}px;width:${w}px;height:${h}px`;
  return `<div class="win" style="${st}">${body}</div>`;
}
function sceneRouter(dir, lay){
  const bg = lay==='palette' ? ghostApp(80,70,700,520)+ghostApp(560,180,600,460) : ghostApp(40,70,500,400);
  const bar = isIsland(dir)?'':edgeBar(dir);
  return desk(dir, bg + bar + routerWin(dir, lay, isIsland(dir)?1060:1100, 660));
}

/* ---------------- Components sheet ---------------- */
function sceneComponents(dir){
  const t = dir==='term';
  const panel=(h,c,st='')=>`<div class="win" style="${st}"><h4>${h}</h4>${c}</div>`;
  return desk(dir, `<div class="sheet">
    ${panel('Buttons',`<div class="wrap"><span class="btn pri">Send answer</span><span class="btn">Keep planning</span><span class="btn gh">Open</span></div>
      <div class="wrap"><span class="ib">${ic('arrow-back-up')}</span><span class="ib on">${ic('pin')}</span><span class="ib">${ic('check')}</span><span class="ib">${ic('external-link')}</span><span class="ib">${ic('settings')}</span></div>
      <div class="wrap"><span class="tip">Reply<small>Your next message goes to this session · ↵</small></span></div>`)}
    ${panel('Card kinds and status',`<div class="wrap">${CARDS.map(tag).join('')}</div>
      <div class="wrap" style="gap:14px">${['q','d','w','s','g','n'].map(k=>`<span class="row" style="gap:6px;font-size:12px">${mk(k,k=='w')}${{q:'needs you',d:'done',w:'working',s:'failing',g:'passing',n:'quiet'}[k]}</span>`).join('')}</div>
      <div class="wrap"><span class="cnt amb">4</span><span class="cnt">2</span><span class="seg2"><span class="on">Open <span class="cnt amb">4</span></span><span>All</span></span></div>`)}
    ${panel('Session tiles',`<div class="wrap" style="gap:12px"><div class="tile amb">${t?'?':ic('bell')}<span class="bdg">?</span></div><div class="tile" style="color:var(--acc)">${t?'CI':ic('bug')}</div><div class="tile">LC</div><div class="tile">${t?'k':ic('key')}</div><div class="tile" style="color:var(--clay)">ZG</div></div>
      <div class="wrap">${Object.keys(P).map(p=>`<span class="chip">${pdot(p)}${p}</span>`).join('')}</div>`)}
    ${panel('Question form',cardFull(CARDS[0],false,{picked:true}).replace('class="card"','class="card" style="padding:0;border:none;background:none;box-shadow:none"'),'grid-column:span 2')}
    ${panel('Inputs',`<div class="field">${ic('search','font-size:14px')}<span>Search inbox and sessions</span></div>
      <div class="row" style="justify-content:space-between"><span>Router only</span><span class="tog"></span></div>
      <div class="row" style="justify-content:space-between"><span>Banners for done turns</span><span class="tog off"></span></div>
      <div class="row" style="justify-content:space-between"><span>Open the Router</span><span class="kbd" style="display:inline">⌃⌥R</span></div>`)}
    ${panel('Inbox rows',`<div style="margin:0 -10px">${INBOX.slice(0,3).map((r,i)=>`<div class="li${i==0?' sel':''}"><div class="av" style="background:${r[1]}">${r[0]}<em style="--c:${r[5]}"></em></div><div style="min-width:0;flex:1"><div class="row"><span class="t">${r[2]}</span><span class="tm">${r[4]}</span></div><div class="m">${r[3]}</div></div></div>`).join('')}</div>`,'grid-column:span 2')}
    ${panel('Chat',`<div style="display:flex;flex-direction:column;gap:10px">${'<div class="msg you"><span class="at">@lcu</span> approve, but skip the rollback tests</div><div class="rcpt">'+ic('circle-check')+'<div><div style="color:var(--tx)">Approved <b>Update notifications</b></div><div>“Skip the rollback tests.”</div></div></div>'}</div>`)}
  </div>`);
}

/* ---------------- Render ---------------- */
function fitAll(){
  document.querySelectorAll('.fit').forEach(f=>{
    const d=f.firstElementChild; const s=f.clientWidth/1240;
    d.style.transform=`scale(${s})`; f.style.height=(760*s)+'px';
  });
}
function scene(title, sub, html){
  return `<section class="scene"><header><h2>${title}</h2><span>${sub}</span></header><div class="fit">${html}</div></section>`;
}
function render(){
  const d = DIRS.find(x=>x.k===S.dir), l = LAYS.find(x=>x.k===S.lay);
  $('#dirs').innerHTML = DIRS.map(x=>`<button data-d="${x.k}" class="${x.k===S.dir?'on':''}">${x.n}</button>`).join('');
  $('#lays').innerHTML = LAYS.map(x=>`<button data-l="${x.k}" class="${x.k===S.lay?'on':''}">${x.n}</button>`).join('');
  document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===S.mode));
  document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
  let h='';
  if(S.view==='one'){
    h += `<div class="intro"><div><h1>${d.n}</h1><p>${d.d}${d.light?' This one has a light version too (Appearance, above).':''}</p></div><div class="refs">${d.refs?'References: '+d.refs:''}<span style="color:#71717a;margin-left:14px">1–6 change direction · Q W E R change layout</span></div></div>`;
    h += scene('Router window', l.d, sceneRouter(S.dir,S.lay));
    h += scene('The bar at rest', isIsland(S.dir)?'The bar moves to the notch: a pill showing the top item and the counts.':'The bar against the edge with the Router on, plus a banner for a question you can answer straight from it.', sceneRest(S.dir));
    h += scene('Hovering the Router', 'The panel that opens beside the bar: the newest cards and what\'s running.', sceneHover(S.dir));
    h += scene('Kept open', 'Everything at once: the inbox, CI and the Router.', sceneHub(S.dir));
    h += scene('Components', 'The building blocks, so you can judge the details.', sceneComponents(S.dir));
  } else {
    h += `<div class="intro"><div><h1>Compare: ${l.n}</h1><p>The same Router screen in every direction. ${l.d}</p></div></div><div class="cmp">`;
    h += DIRS.map(x=>`<div><h3>${x.n}<small>${x.refs}</small></h3><div class="fit">${sceneRouter(x.k,S.lay)}</div></div>`).join('');
    h += `</div>`;
  }
  $('#main').innerHTML = h;
  fitAll();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.d) S.dir=b.dataset.d;
  if(b.dataset.l) S.lay=b.dataset.l;
  if(b.dataset.m) S.mode=b.dataset.m;
  if(b.dataset.v) S.view=b.dataset.v;
  render();
});
document.addEventListener('keydown',e=>{
  const i='123456'.indexOf(e.key); if(i>=0){S.dir=DIRS[i].k;S.view='one';render()}
  const j='qwer'.indexOf(e.key.toLowerCase()); if(j>=0){S.lay=LAYS[j].k;render()}
});
window.addEventListener('resize',fitAll);
render();
</script>
</body>
</html>
